#spring.application.name=ecommerce
spring:
  datasource:
    url: jdbc:h2:mem:ecommerce
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: caffeine

    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

